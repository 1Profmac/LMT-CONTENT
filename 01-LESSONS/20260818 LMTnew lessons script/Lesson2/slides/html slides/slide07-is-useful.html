<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px;
    height: 1080px;
    background: #0E1C2F;
    font-family: 'Segoe UI', Arial, sans-serif;
    position: relative;
    overflow: hidden;
  }
  .series-tag {
    position: absolute;
    top: 36px;
    left: 80px;
    font-size: 22px;
    font-weight: 700;
    color: #C8942E;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .gold-bar-top {
    position: absolute;
    top: 70px;
    left: 80px;
    right: 80px;
    height: 4px;
    background: #C8942E;
  }
  .gold-bar-bottom {
    position: absolute;
    bottom: 70px;
    left: 80px;
    right: 80px;
    height: 4px;
    background: #C8942E;
  }
  .footer {
    position: absolute;
    bottom: 30px;
    left: 80px;
    right: 80px;
    font-size: 20px;
    color: #C8942E;
    text-align: center;
  }
  .content {
    position: absolute;
    top: 100px;
    bottom: 90px;
    left: 80px;
    right: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }


  .ask-label {
    font-size: 32px;
    color: #AAAAAA;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .big-question {
    font-size: 110px;
    font-weight: 900;
    color: #C8942E;
    text-align: center;
    line-height: 1.05;
    margin-bottom: 36px;
  }
  .not-perfect {
    font-size: 36px;
    color: #FFFFFF;
    text-align: center;
    line-height: 1.6;
  }
  .not-perfect span { color: #C8942E; font-weight: 700; }

</style>
</head>
<body>
  <div class="series-tag">DIGITAL PIONEER &nbsp;|&nbsp; LESSON 2B</div>
  <div class="gold-bar-top"></div>
  <div class="gold-bar-bottom"></div>
  <div class="footer">50+TechBridge &nbsp;|&nbsp; Brian McKinney &nbsp;|&nbsp; 50plustechbridge.com</div>
  <div class="content">

    <div class="ask-label">Ask yourself one question</div>
    <div class="big-question">Is this useful?</div>
    <div class="not-perfect">
      Not is it <span>perfect.</span>&nbsp;&nbsp;Not is it exactly right about everything.<br>
      Just — is there something here you can actually use?
    </div>

  </div>
</body>
</html>
