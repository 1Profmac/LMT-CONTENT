<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px;
    height: 1080px;
    background: #0E1C2F;
    font-family: 'Segoe UI', Arial, sans-serif;
    position: relative;
    overflow: hidden;
  }
  .series-tag {
    position: absolute;
    top: 36px;
    left: 80px;
    font-size: 22px;
    font-weight: 700;
    color: #C8942E;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .gold-bar-top {
    position: absolute;
    top: 70px;
    left: 80px;
    right: 80px;
    height: 4px;
    background: #C8942E;
  }
  .gold-bar-bottom {
    position: absolute;
    bottom: 70px;
    left: 80px;
    right: 80px;
    height: 4px;
    background: #C8942E;
  }
  .footer {
    position: absolute;
    bottom: 30px;
    left: 80px;
    right: 80px;
    font-size: 20px;
    color: #C8942E;
    text-align: center;
  }
  .content {
    position: absolute;
    top: 100px;
    bottom: 90px;
    left: 80px;
    right: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }


  .big-instruction {
    font-size: 80px;
    font-weight: 800;
    color: #FFFFFF;
    text-align: center;
    line-height: 1.15;
    margin-bottom: 30px;
  }
  .big-instruction span { color: #C8942E; }
  .arrow-box {
    width: 140px;
    height: 140px;
    background: #C8942E;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 70px;
    color: #FFFFFF;
    margin: 20px auto 30px;
  }
  .watch-text {
    font-size: 42px;
    color: #AAAAAA;
    text-align: center;
  }

</style>
</head>
<body>
  <div class="series-tag">DIGITAL PIONEER &nbsp;|&nbsp; LESSON 2B</div>
  <div class="gold-bar-top"></div>
  <div class="gold-bar-bottom"></div>
  <div class="footer">50+TechBridge &nbsp;|&nbsp; Brian McKinney &nbsp;|&nbsp; 50plustechbridge.com</div>
  <div class="content">

    <div class="big-instruction">Press Enter<br>or tap the <span>arrow button.</span></div>
    <div class="arrow-box">&#10148;</div>
    <div class="watch-text">Then watch.</div>

  </div>
</body>
</html>
