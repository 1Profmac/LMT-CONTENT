<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px;
    height: 1080px;
    background: #0E1C2F;
    font-family: 'Segoe UI', Arial, sans-serif;
    position: relative;
    overflow: hidden;
  }
  .series-tag {
    position: absolute;
    top: 36px;
    left: 80px;
    font-size: 22px;
    font-weight: 700;
    color: #C8942E;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .gold-bar-top {
    position: absolute;
    top: 70px;
    left: 80px;
    right: 80px;
    height: 4px;
    background: #C8942E;
  }
  .gold-bar-bottom {
    position: absolute;
    bottom: 70px;
    left: 80px;
    right: 80px;
    height: 4px;
    background: #C8942E;
  }
  .footer {
    position: absolute;
    bottom: 30px;
    left: 80px;
    right: 80px;
    font-size: 20px;
    color: #C8942E;
    text-align: center;
  }
  .content {
    position: absolute;
    top: 100px;
    bottom: 90px;
    left: 80px;
    right: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }


  .heading {
    font-size: 56px;
    font-weight: 800;
    color: #FFFFFF;
    text-align: center;
    margin-bottom: 50px;
  }
  .heading span { color: #C8942E; }
  .points {
    display: flex;
    flex-direction: column;
    gap: 28px;
    width: 100%;
    max-width: 1100px;
  }
  .point {
    display: flex;
    align-items: center;
    gap: 30px;
    background: rgba(200,148,46,0.12);
    border-left: 6px solid #C8942E;
    border-radius: 8px;
    padding: 24px 40px;
  }
  .check {
    font-size: 44px;
    color: #C8942E;
    flex-shrink: 0;
  }
  .point-text {
    font-size: 36px;
    color: #FFFFFF;
    line-height: 1.3;
  }

</style>
</head>
<body>
  <div class="series-tag">DIGITAL PIONEER &nbsp;|&nbsp; LESSON 2B</div>
  <div class="gold-bar-top"></div>
  <div class="gold-bar-bottom"></div>
  <div class="footer">50+TechBridge &nbsp;|&nbsp; Brian McKinney &nbsp;|&nbsp; 50plustechbridge.com</div>
  <div class="content">

    <div class="heading">The Starter Prompt tells AI <span>three things</span></div>
    <div class="points">
      <div class="point"><div class="check">&#10003;</div><div class="point-text">That you are <strong>new to AI</strong></div></div>
      <div class="point"><div class="check">&#10003;</div><div class="point-text">That you are <strong>over 50</strong></div></div>
      <div class="point"><div class="check">&#10003;</div><div class="point-text">Exactly <strong>how to format the answer</strong> — short steps, plain language</div></div>
    </div>

  </div>
</body>
</html>
