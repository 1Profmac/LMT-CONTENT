<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1920px;
    background: #0E1C2F;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .phone {
    width: 500px;
    height: 1000px;
    background: #FFFFFF;
    border-radius: 50px;
    border: 6px solid #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 80px 40px 40px;
    position: relative;
  }
  .phone::before {
    content: '';
    width: 150px;
    height: 25px;
    background: #333;
    border-radius: 15px;
    position: absolute;
    top: 20px;
  }
  .option-badge {
    background: #C8942E;
    color: #FFF;
    font-size: 20px;
    font-weight: 700;
    padding: 8px 20px;
    border-radius: 20px;
    margin-bottom: 15px;
  }
  .instruction {
    font-size: 38px;
    font-weight: 700;
    color: #0E1C2F;
    text-align: center;
    margin-bottom: 10px;
  }
  .helper {
    font-size: 22px;
    color: #888;
    text-align: center;
    margin-bottom: 30px;
  }
  .steps-list {
    width: 100%;
    padding: 0 10px;
  }
  .step-item {
    display: flex;
    align-items: flex-start;
    gap: 15px;
    margin-bottom: 20px;
  }
  .step-num {
    width: 40px;
    height: 40px;
    background: #C8942E;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
    color: #FFF;
    flex-shrink: 0;
  }
  .step-desc {
    font-size: 24px;
    color: #333;
    line-height: 1.4;
    padding-top: 5px;
  }
  .step-bold {
    font-weight: 700;
    color: #0E1C2F;
  }
  .result-box {
    background: #109F35;
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    text-align: center;
    margin-top: 20px;
  }
  .result-text {
    font-size: 22px;
    color: #FFF;
    font-weight: 600;
    line-height: 1.4;
  }
  .step-box {
    margin-top: 40px;
    background: #0E1C2F;
    border: 3px solid #C8942E;
    border-radius: 12px;
    padding: 18px 50px;
  }
  .step-text {
    font-size: 36px;
    font-weight: 600;
    color: #FFFFFF;
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="option-badge">OPTION A</div>
    <div class="instruction">Share Your<br>Location</div>
    <div class="helper">So family knows you're safe</div>
    <div class="steps-list">
      <div class="step-item">
        <div class="step-num">1</div>
        <div class="step-desc">Open <span class="step-bold">Find My</span> app</div>
      </div>
      <div class="step-item">
        <div class="step-num">2</div>
        <div class="step-desc">Tap <span class="step-bold">Share My Location</span></div>
      </div>
      <div class="step-item">
        <div class="step-num">3</div>
        <div class="step-desc">Pick <span class="step-bold">one family member</span></div>
      </div>
    </div>
    <div class="result-box">
      <div class="result-text">&#10003; They can see you're home safe<br>without calling every hour</div>
    </div>
  </div>
  <div class="step-box">
    <div class="step-text">Option A</div>
  </div>
</body>
</html>
