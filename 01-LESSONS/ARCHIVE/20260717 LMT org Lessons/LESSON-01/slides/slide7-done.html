<!DOCTYPE html>
<html>
<head>
<style>
  @keyframes pop {
    0% { transform: scale(0); opacity: 0; }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes confetti1 {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(400px) rotate(720deg); opacity: 0; }
  }
  @keyframes confetti2 {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(350px) rotate(-540deg); opacity: 0; }
  }
  @keyframes glow {
    0% { box-shadow: 0 0 20px #C8942E; }
    50% { box-shadow: 0 0 60px #E8B84B, 0 0 100px #C8942E; }
    100% { box-shadow: 0 0 20px #C8942E; }
  }
  @keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
    100% { transform: translateY(0); }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1920px;
    background: linear-gradient(180deg, #0E1C2F 0%, #1a3050 50%, #0E1C2F 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .confetti {
    position: absolute;
    width: 15px;
    height: 15px;
    border-radius: 3px;
  }
  .c1 { background: #C8942E; top: -20px; left: 10%; animation: confetti1 3s ease-in infinite; animation-delay: 0s; }
  .c2 { background: #E8733A; top: -20px; left: 25%; animation: confetti2 2.5s ease-in infinite; animation-delay: 0.3s; width: 12px; height: 18px; }
  .c3 { background: #E8B84B; top: -20px; left: 40%; animation: confetti1 2.8s ease-in infinite; animation-delay: 0.6s; border-radius: 50%; }
  .c4 { background: #109F35; top: -20px; left: 55%; animation: confetti2 3.2s ease-in infinite; animation-delay: 0.2s; }
  .c5 { background: #C8942E; top: -20px; left: 70%; animation: confetti1 2.6s ease-in infinite; animation-delay: 0.8s; width: 18px; height: 12px; }
  .c6 { background: #E8733A; top: -20px; left: 85%; animation: confetti2 3s ease-in infinite; animation-delay: 0.4s; border-radius: 50%; width: 12px; height: 12px; }
  .c7 { background: #E8B84B; top: -20px; left: 15%; animation: confetti1 2.7s ease-in infinite; animation-delay: 1s; }
  .c8 { background: #109F35; top: -20px; left: 50%; animation: confetti2 2.9s ease-in infinite; animation-delay: 0.7s; width: 10px; height: 16px; }
  .c9 { background: #C8942E; top: -20px; left: 65%; animation: confetti1 3.1s ease-in infinite; animation-delay: 0.5s; border-radius: 50%; }
  .c10 { background: #E8B84B; top: -20px; left: 80%; animation: confetti2 2.4s ease-in infinite; animation-delay: 0.1s; }
  .c11 { background: #E8733A; top: -20px; left: 35%; animation: confetti1 2.5s ease-in infinite; animation-delay: 1.2s; width: 14px; height: 14px; border-radius: 50%; }
  .c12 { background: #109F35; top: -20px; left: 90%; animation: confetti2 3.3s ease-in infinite; animation-delay: 0.9s; }
  .trophy {
    font-size: 120px;
    animation: float 2s ease-in-out infinite;
    margin-bottom: 20px;
  }
  .badge {
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, #E8B84B, #C8942E);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: glow 2s ease-in-out infinite, pop 0.6s ease-out;
    margin-bottom: 30px;
  }
  .badge-check {
    font-size: 110px;
    color: #FFFFFF;
  }
  .congrats {
    font-size: 64px;
    font-weight: 900;
    color: #E8B84B;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 5px;
    margin-bottom: 10px;
    text-shadow: 0 0 30px rgba(232, 184, 75, 0.5);
  }
  .did-it {
    font-size: 52px;
    font-weight: 700;
    color: #FFFFFF;
    text-align: center;
    margin-bottom: 30px;
  }
  .message {
    font-size: 30px;
    color: #C4CDD9;
    text-align: center;
    line-height: 1.6;
    margin-bottom: 40px;
    padding: 0 80px;
  }
  .share-box {
    background: rgba(255,255,255,0.1);
    border: 2px solid #C8942E;
    border-radius: 16px;
    padding: 30px 40px;
    text-align: center;
    margin-bottom: 40px;
  }
  .share-label {
    font-size: 22px;
    color: #C8942E;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 3px;
  }
  .share-text {
    font-size: 28px;
    font-weight: 600;
    color: #FFFFFF;
    font-style: italic;
    line-height: 1.4;
  }
  .pioneer-banner {
    background: linear-gradient(90deg, #C8942E, #E8B84B, #C8942E);
    border-radius: 16px;
    padding: 25px 60px;
    margin-bottom: 25px;
  }
  .pioneer-text {
    font-size: 38px;
    font-weight: 900;
    color: #0E1C2F;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 3px;
  }
  .next-line {
    font-size: 26px;
    color: #C4CDD9;
    text-align: center;
    line-height: 1.5;
  }
  .next-bold {
    color: #E8B84B;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="confetti c1"></div>
  <div class="confetti c2"></div>
  <div class="confetti c3"></div>
  <div class="confetti c4"></div>
  <div class="confetti c5"></div>
  <div class="confetti c6"></div>
  <div class="confetti c7"></div>
  <div class="confetti c8"></div>
  <div class="confetti c9"></div>
  <div class="confetti c10"></div>
  <div class="confetti c11"></div>
  <div class="confetti c12"></div>

  <div class="trophy">&#127942;</div>
  <div class="badge">
    <span class="badge-check">&#10003;</span>
  </div>
  <div class="congrats">CONGRATULATIONS!</div>
  <div class="did-it">You Did It!</div>
  <div class="message">Your phone is easier to read now.<br>Bigger text. Bolder fonts.<br>You made that happen.</div>
  <div class="share-box">
    <div class="share-label">Show someone right now</div>
    <div class="share-text">"Look at my phone —<br>I just did that myself!"</div>
  </div>
  <div class="pioneer-banner">
    <div class="pioneer-text">You're a Digital Pioneer!</div>
  </div>
  <div class="next-line">Lesson 1 of 3 complete<br><span class="next-bold">Next up: 3 tools that save you time every week</span></div>
</body>
</html>
