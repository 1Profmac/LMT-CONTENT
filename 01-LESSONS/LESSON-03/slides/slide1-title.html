<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1920px;
    background: #0E1C2F;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .phone {
    width: 500px;
    height: 1000px;
    background: #FFFFFF;
    border-radius: 50px;
    border: 6px solid #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 40px;
    position: relative;
  }
  .phone::before {
    content: '';
    width: 150px;
    height: 25px;
    background: #333;
    border-radius: 15px;
    position: absolute;
    top: 20px;
  }
  .phone-title {
    font-size: 44px;
    font-weight: 700;
    color: #0E1C2F;
    text-align: center;
    line-height: 1.3;
    margin-bottom: 30px;
  }
  .subtitle {
    font-size: 24px;
    color: #888;
    text-align: center;
    line-height: 1.4;
    margin-bottom: 30px;
  }
  .options {
    width: 100%;
  }
  .option {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 18px 20px;
    margin-bottom: 12px;
    background: #F5F5F5;
    border-radius: 12px;
  }
  .option-icon {
    font-size: 36px;
  }
  .option-text {
    font-size: 22px;
    font-weight: 600;
    color: #0E1C2F;
  }
  .pick-one {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    color: #C8942E;
    margin-top: 20px;
  }
  .step-box {
    margin-top: 40px;
    background: #0E1C2F;
    border: 3px solid #C8942E;
    border-radius: 12px;
    padding: 18px 50px;
  }
  .step-text {
    font-size: 36px;
    font-weight: 600;
    color: #FFFFFF;
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="phone-title">One Step Toward<br>Independence</div>
    <div class="subtitle">Pick the one that matters<br>most to you</div>
    <div class="options">
      <div class="option">
        <span class="option-icon">&#128205;</span>
        <span class="option-text">Share your location with family</span>
      </div>
      <div class="option">
        <span class="option-icon">&#128722;</span>
        <span class="option-text">Order groceries from your couch</span>
      </div>
      <div class="option">
        <span class="option-icon">&#129658;</span>
        <span class="option-text">Video call your doctor</span>
      </div>
    </div>
    <div class="pick-one">Pick ONE. Do it. That's all.</div>
  </div>
  <div class="step-box">
    <div class="step-text">Choose your path</div>
  </div>
</body>
</html>
